[package]
name = "ce-browser"
version = "0.1.21"
description = "Tabbed WebView2 browser"
authors = ["you"]
edition = "2024"

[lib]
name = "ce_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
psl = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2", features = ["image-ico", "image-png", "devtools", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
url = "2"
ureq = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# webview2-com and windows must match the versions wry is built against, or the
# WebView2 interface types will not line up with `PlatformWebview::controller()`.
[target.'cfg(windows)'.dependencies]
drag = "2.1"
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
] }
windows-core = "0.61"

[profile.release]
panic = "abort"
strip = true

# Wry's WebView2 IPC bridge installs a permanent global named `ipc`. Google Sheets
# declares that same name, so the spreadsheet fails to parse until the property is
# configurable. `vendor/wry` is wry 0.55.1 with that one change.
[patch.crates-io]
wry = { path = "vendor/wry" }
