<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notes downloads</title>
    <style>
      body { margin: 12px; font: 13px/1.4 system-ui, sans-serif; color: #f4f4f5; background: #18181b; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1 id="host-downloads-title">Notes downloads</h1>
    <pre id="host-downloads-output">Loading downloads…</pre>
    <script>
      var output = document.getElementById("host-downloads-output");
      window.ce.downloads.list().then(function (items) {
        output.textContent = JSON.stringify(items, null, 2);
      }, function (error) {
        output.textContent = error && error.message ? error.message : String(error);
      });
    </script>
  </body>
</html>
