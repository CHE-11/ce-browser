<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glance</title>
    <link id="glance-panel-style" rel="stylesheet" href="glance.css" />
  </head>
  <body id="glance-panel" data-surface="panel">
    <header id="glance-panel-header">
      <h1 id="glance-title">Glance</h1>
      <p id="glance-count">0 open</p>
    </header>
    <div id="glance-actions">
      <button id="glance-new" type="button">New tab</button>
      <button id="glance-reload" type="button">Reload</button>
    </div>
    <div id="glance-list"></div>
    <p id="glance-error"></p>
    <script id="glance-panel-script" src="glance.js"></script>
  </body>
</html>
